# Local-only Docker Compose override for Project Intelligence testing.
#
# Does NOT replace docker-compose.yaml. Does NOT change Render.
# Forces the backend onto the Compose Postgres `db` service and the Compose
# RustFS `s3` service so Neon and Cloudflare R2 stay untouched.
#
# Usage (from this directory):
#   docker compose -f docker-compose.yaml -f docker-compose.local.yml up -d --build
#
# OpenAI / feature-flag values are read from your shell or git-ignored `.env`
# via ${VAR} interpolation. This file contains no secrets.

services:
  backend:
    environment:
      # Absolute local URL — must not use ${DATABASE_URL} (that would re-import Neon from .env).
      DATABASE_URL: postgresql://devzgo:devzgo@db:5432/devzgo_db

      # Local object storage (Compose s3). Do not inherit R2 credentials from .env.
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://s3:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: devzgo
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: devzgo
      S3_SECRET_ACCESS_KEY: devzgo-secret

      # Project Intelligence (populated from host .env / environment; empty key disables AI drafts only)
      FEATURE_PROJECT_INTELLIGENCE: ${FEATURE_PROJECT_INTELLIGENCE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PROJECT_AI_PROVIDER: ${PROJECT_AI_PROVIDER:-openai}
      PROJECT_AI_MODEL: ${PROJECT_AI_MODEL:-gpt-5.4-mini}
      PI_MONTHLY_TOKEN_SOFT: ${PI_MONTHLY_TOKEN_SOFT:-200000}
      PI_MONTHLY_TOKEN_HARD: ${PI_MONTHLY_TOKEN_HARD:-500000}

      # Keep frontend callbacks on localhost for local testing
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
