# To resolve tgge problem of Multi-Container Application we use ths to run all needed
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: devzgo
      POSTGRES_PASSWORD: devzgo
      POSTGRES_DB: devzgo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local S3-compatible bucket (console: http://localhost:9001, devzgo / devzgo-secret)
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: devzgo
      RUSTFS_SECRET_KEY: devzgo-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: devzgo
      AWS_SECRET_ACCESS_KEY: devzgo-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c", "until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket devzgo 2>/dev/null || aws --endpoint-url http://s3:9000 s3 mb s3://devzgo; do sleep 2; done"]

  backend:
    build: .
    depends_on:
      - db
      - s3-init
    ports:
      - "8000:8000"
    # Overrides come from your shell or the .env file next to this compose file; defaults are for local dev.
    # DATABASE_URL unset -> the local db container. Set it in .env (e.g. Neon) to use that database instead.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://devzgo:devzgo@db:5432/devzgo_db}
      SECRET_KEY: "supersecretkey"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL:-http://localhost:9000}}
      S3_BUCKET: ${S3_BUCKET:-devzgo}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devzgo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devzgo-secret}
    volumes:
      # Persist covers, videos, and extracted workspaces across rebuilds
      - backend_storage:/app/storage

volumes:
  postgres_data:
  backend_storage:
  s3_data:
