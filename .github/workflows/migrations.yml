name: Migration history

on:
  push:
  pull_request:

jobs:
  single-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install alembic==1.18.4 SQLAlchemy==2.0.47 pytest==8.3.5
      - run: python -m pytest tests/test_migration_history.py -q
